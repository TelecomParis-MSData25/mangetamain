[project]
name = "mangetamain"
version = "0.1.0"
description = "Projet de la matière DATA702-Kit_Big_Data du Mastère Spécialisé Data de Télécom Paris"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "ipynbname>=2025.8.0.0",
    "kaggle>=1.7.4.5",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "seaborn>=0.13.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.24.0",
    "sphinx>=8.2.3",
    "streamlit>=1.50.0",
    "scipy>=1.16.2",
    "scikit-learn>=1.7.2",
    "statsmodels>=0.14.5",
]

# Configuration de pytest-cov / coverage
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=dataset_analysis",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=85",
    "--cov-branch",
    "-v"
]

markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

pythonpath = [
    "."
]

[tool.coverage.run]
source = ["dataset_analysis"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.7.0",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [
    "dataset_analysis/**/*.ipynb",
]
